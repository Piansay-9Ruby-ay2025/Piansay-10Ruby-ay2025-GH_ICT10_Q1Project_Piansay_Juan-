<head>
<!-- PY script -->
<meta charset="UTF-8">
<link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
<script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Diner online pick up</title>
<h1>Diner menu</h1>
</head>
<body>
<!-- Nav bar -->
<nav class="navbar text-center" style="background-color:rgb(38, 55, 103); color:rgb(236, 238, 236);">
    <div class="nav-brand text-center">Diner Menu navbar</div>
    <ul class="nav-menu">
        <li>
            <a href="Skugen.html" class="#">SKU Generator</a>
        </li>
        <li>
            <a href="index.html" class="active">Receipt Generator</a>
        </li>
    </ul>
</nav>
<!-- container for sku -->
<div class="container" style="background-color:rgb(85, 118, 207)" class="container-fluid">
<div class="container"></div>
    <h2>Items</h2>
            <div class="col-md-6">
                <h2 class="text-center">SKU Generator</h2>

    <label>Perishables Category</label>

        <select id="category"><br>
                    <option value="JUC">Juicy</option>
                    <option value="SNK">Snackies</option>
                    <option value="MLK">Shake of milk</option>
        </select>
<!-- List of Sku  -->
    <label>Product Name</label>

    <select id="product"><br>
        <option value="SA"> Sandwich</option>
        <option value="IL"> Isol</option>
        <option value="DT"> Donut</option>
        <option value="AM"> Assorted Milkshakes</option>
        <option value="AJ"> Aplle Juice</option>
        <option value="OJ"> Orange Juice</option>
    </select>

    <label for="stock">Stock Quantity</label>
    <input type="number" id="stock" placeholder="Enter a value" min="1">
<!-- Buttons -->
        <button type="button" class="btn btn-warning mt-3" py-click="generate_sku"
                        value="generate_sku">Generate SKU</button><br><br>

        <h2 class="text-center">Generated SKU</h2>
                <div id="result"></div>
            </div>
        </div>
    </div>
<!-- footer -->
    <footer class="text-center py-4 bg-success text-light fixed-bottom"> Project by @Juan Miguel Piansay SKU Generator
        and Receipt Generator</footer>
    <py-script src="main.py"></py-script>
</body>

</html>
